params:
  - id: bm_db_pw
    type: secret
    name: "数据库密码"
    description: "PostgreSQL 数据库密码（已预置随机值，应用自动使用）"
    default_value: "tR7wKe2mPa9xQz4b"
    optional: false
  - id: bm_jwt
    type: secret
    name: "JWT 密钥"
    description: "应用内部 JWT 签名密钥（已预置随机值，无需修改）"
    default_value: "uW3nEs8cRt5yHk2m"
    optional: false

